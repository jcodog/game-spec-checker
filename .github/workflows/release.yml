name: Windows production build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: cargo build --release -p gamespec-cli --locked
      - run: bun run desktop:build
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe) + @(Get-Item target/release/gamespec.exe)
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content target/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GameSpec-Checker-Windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/gamespec.exe
            target/release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/gamespec.exe
            target/release/SHA256SUMS.txt
