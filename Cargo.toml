[workspace]
members = ["crates/gamespec-core", "crates/gamespec-cli", "src-tauri"]
default-members = ["crates/gamespec-core", "crates/gamespec-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jcodog/game-spec-checker"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gamespec-core = { path = "crates/gamespec-core" }
